<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
    <title>The Legend of Zelda: Ocarina of Time</title>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #game-container { 
            width: 100%; 
            height: 100vh; 
            position: relative;
        }
        .loading, .error, .debug {
            color: white;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }
        .loading {
            top: 40%;
            font-size: 24px;
        }
        .error {
            top: 40%;
            color: #ff6b6b;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            max-width: 80%;
            display: none;
        }
        .debug {
            bottom: 10px;
            font-size: 12px;
            color: #aaa;
            max-width: 90%;
        }
        .controls-hint {
            position: absolute;
            bottom: 60px;
            left: 0;
            right: 0;
            color: white;
            text-align: center;
            font-size: 14px;
            opacity: 0.7;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="loading" id="loading">Loading game...<br><small>This may take a moment</small></div>
        <div class="error" id="error">
            <h3>Game Failed to Load</h3>
            <p id="error-message">Unknown error occurred</p>
            <button id="retry-btn" style="margin-top: 10px; padding: 8px 16px; background: #4285f4; color: white; border: none; border-radius: 4px; cursor: pointer;">Retry</button>
        </div>
        <div class="debug" id="debug"></div>
        <div class="controls-hint" id="controls-hint">Tap the game to enable controls</div>
    </div>

    <script>
        // Debug logger
        function log(message) {
            console.log(message);
            document.getElementById('debug').innerHTML = message;
        }
        
        // Error handler
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error-message').textContent = message;
        }
        
        // Load emulator script with error handling
        function loadEmulator() {
            log('Loading emulator...');
            const script = document.createElement('script');
            script.src = 'data/loader.js';
            script.onerror = function() {
                showError('Failed to load emulator from data/loader.js. Check if the file exists and is accessible.');
            };
            script.onload = function() {
                log('Emulator loaded, initializing game...');
                setTimeout(initGame, 1000);
            };
            document.head.appendChild(script);
        }
        
        // Initialize game
        function initGame() {
            try {
                // Check if EJS is defined
                if (typeof EJS === 'undefined') {
                    showError('EmulatorJS not loaded properly. Check data/loader.js');
                    return;
                }
                
                log('Starting game...');
                
                // Create game div
                const gameDiv = document.createElement('div');
                gameDiv.id = 'game';
                gameDiv.style.width = '100%';
                gameDiv.style.height = '100%';
                document.getElementById('game-container').appendChild(gameDiv);
                
                // Configure emulator with URL encoded ROM path
                EJS_player = '#game';
                EJS_gameName = 'Ocarina of Time';
                EJS_gameUrl = encodeURI('The Legend of Zelda Ocarina of Time.z64');
                EJS_pathtodata = 'data/';
                EJS_startOnLoaded = true;
                EJS_gameID = 1;
                // Configure emulator with URL encoded ROM path
                EJS_player = '#game';
                EJS_core = 'n64';  // ← ADD THIS LINE - CRITICAL!
                EJS_gameName = 'Ocarina of Time';
                EJS_gameUrl = 'The%20Legend%20of%20Zelda%20Ocarina%20of%20Time.z64';  // ← Properly encoded
                EJS_pathtodata = 'data/';
                EJS_startOnLoaded = true;
                EJS_gameID = 1;
                
                // iPad specific settings
                EJS_Buttons = {
                    'start': 0,
                    'select': 1,
                    'a': 2,
                    'b': 3,
                    'l': 4,
                    'r': 5,
                    'z': 6,
                    'c_up': 7,
                    'c_down': 8,
                    'c_left': 9,
                    'c_right': 10,
                    'dpad_up': 11,
                    'dpad_down': 12,
                    'dpad_left': 13,
                    'dpad_right': 14,
                    'analog_up': 15,
                    'analog_down': 16,
                    'analog_left': 17,
                    'analog_right': 18
                };
                
                // Check if game loads after timeout
                setTimeout(function() {
                    const canvas = document.querySelector('#game canvas');
                    if (!canvas) {
                        showError('Game failed to initialize. This could be due to an incompatible ROM file or missing emulator data.');
                    } else {
                        log('Game loaded successfully!');
                        document.getElementById('loading').style.display = 'none';
                        
                        // Hide controls hint after 5 seconds
                        setTimeout(function() {
                            document.getElementById('controls-hint').style.display = 'none';
                        }, 5000);
                    }
                }, 15000); // Longer timeout for iPad
                
            } catch (e) {
                showError('Error initializing game: ' + e.message);
            }
        }
        
        // Retry button
        document.getElementById('retry-btn').addEventListener('click', function() {
            document.getElementById('error').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            loadEmulator();
        });
        
        // Start loading
        loadEmulator();
        
        // Add touch event listener to enable audio on iOS
        document.addEventListener('touchstart', function() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            document.getElementById('controls-hint').style.display = 'none';
        }, { once: true });
    </script>
</body>
</html>
