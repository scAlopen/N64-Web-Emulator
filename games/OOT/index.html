<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zelda OOT</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #game {
            width: 100%;
            max-width: 100vw;
            height: 100vh;
        }
        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            color: white;
            background: rgba(0,0,0,0.9);
            padding: 15px;
            font-family: monospace;
            font-size: 11px;
            z-index: 1000;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="status">Initializing...</div>
    <div id="game"></div>
    
    <script>
        let logs = [];
        
        function addLog(msg) {
            console.log(msg);
            logs.push(new Date().toLocaleTimeString() + ': ' + msg);
            document.getElementById('status').innerHTML = logs.join('<br>');
        }
        
        // Capture console errors
        window.onerror = function(msg, url, line) {
            addLog('ERROR: ' + msg + ' (line ' + line + ')');
        };
        
        addLog('Starting...');
        
        // Set up configuration
        window.EJS_player = '#game';
        window.EJS_core = 'n64';
        window.EJS_gameUrl = 'https://files.catbox.moe/6l3no3.z64';
        window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/';
        
        addLog('Config set: N64 core, ROM from Catbox');
        
        // Monitor the game div for changes
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length > 0) {
                    addLog('Element added to #game');
                    const canvas = document.querySelector('#game canvas');
                    if (canvas) {
                        addLog('✓ Canvas detected! Game may be starting...');
                    }
                }
            });
        });
        
        observer.observe(document.getElementById('game'), { childList: true, subtree: true });
        
        addLog('Loading EmulatorJS from CDN...');
    </script>
    
    <script src="https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/loader.js" 
            onload="addLog('✓ EmulatorJS script loaded');"
            onerror="addLog('✗ FAILED to load EmulatorJS script');">
    </script>
    
    <script>
        // Check progress at intervals
        setTimeout(() => addLog('Checkpoint: 15 seconds...'), 15000);
        setTimeout(() => addLog('Checkpoint: 30 seconds...'), 30000);
        setTimeout(() => addLog('Checkpoint: 45 seconds...'), 45000);
        setTimeout(() => addLog('Checkpoint: 60 seconds...'), 60000);
        
        setTimeout(function() {
            const canvas = document.querySelector('#game canvas');
            if (canvas) {
                addLog('✓✓✓ SUCCESS! Game canvas found!');
                setTimeout(() => {
                    document.getElementById('status').style.display = 'none';
                }, 3000);
            } else {
                addLog('✗ No canvas after 90 seconds');
                addLog('DIAGNOSIS: iPad Safari cannot handle N64 emulation');
                addLog('SOLUTION: Use Delta Emulator app from App Store');
            }
        }, 90000);
    </script>
</body>
</html>
