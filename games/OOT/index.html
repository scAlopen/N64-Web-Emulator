<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zelda OOT</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #game {
            width: 100%;
            max-width: 100vw;
            height: 100vh;
        }
        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="status">Loading...</div>
    <div id="game"></div>
    
    <script>
        // Configure emulator
          window.EJS_player = '#game';
        window.EJS_core = 'n64';
        window.EJS_gameUrl = 'https://files.catbox.moe/5qa18k.z64';
        window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/';
        window.EJS_language = 'en-US';
        window.EJS_defaultLang = true;
        
        // Optional: Disable language files if they're causing issues
        window.EJS_defaultLang = true;  // Use built-in English
        
        document.getElementById('status').textContent = 'Loading emulator...';
        
        setTimeout(function() {
            const canvas = document.querySelector('#game canvas');
            if (canvas) {
                document.getElementById('status').textContent = 'Game running!';
                setTimeout(() => {
                    document.getElementById('status').style.display = 'none';
                }, 3000);
            } else {
                document.getElementById('status').textContent = 'Loading... (N64 may not work on iPad)';
            }
        }, 60000);
    </script>
    
    <script src="https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/loader.js"></script>
</body>
</html>
