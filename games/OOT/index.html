<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zelda OOT</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #game {
            width: 100%;
            max-width: 100vw;
            height: 100vh;
        }
        #status {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="status">Loading...</div>
    <div id="game"></div>
    
    <script>
        document.getElementById('status').textContent = 'Step 1: Configuring...';
        
        // Set up configuration
        window.EJS_player = '#game';
        window.EJS_core = 'n64';
        window.EJS_gameUrl = 'zelda-oot.z64';  // RENAME YOUR ROM TO THIS!
        window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/';
        
        document.getElementById('status').textContent = 'Step 2: Loading EmulatorJS...';
    </script>
    
    <script src="https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/loader.js" 
            onload="document.getElementById('status').textContent = 'Step 3: EmulatorJS loaded! Starting game...';"
            onerror="document.getElementById('status').textContent = 'ERROR: Could not load EmulatorJS from CDN. Check internet connection.';">
    </script>
    
    <script>
        // Check after 30 seconds
        setTimeout(function() {
            if (document.querySelector('#game canvas')) {
                document.getElementById('status').textContent = 'Game running!';
                setTimeout(function() {
                    document.getElementById('status').style.display = 'none';
                }, 3000);
            } else {
                document.getElementById('status').textContent = 'FAILED: N64 emulation does not work well on iPad. Use Delta Emulator app instead.';
            }
        }, 30000);
    </script>
</body>
</html>
