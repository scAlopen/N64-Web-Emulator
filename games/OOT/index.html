<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
    <title>The Legend of Zelda: Ocarina of Time</title>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #game-container { 
            width: 100%; 
            height: 100vh; 
            position: relative;
        }
        .loading, .error, .debug {
            color: white;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }
        .loading {
            top: 40%;
            font-size: 24px;
        }
        .error {
            top: 40%;
            color: #ff6b6b;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            max-width: 80%;
            display: none;
        }
        .debug {
            bottom: 10px;
            font-size: 12px;
            color: #aaa;
            max-width: 90%;
        }
        .controls-hint {
            position: absolute;
            bottom: 60px;
            left: 0;
            right: 0;
            color: white;
            text-align: center;
            font-size: 14px;
            opacity: 0.7;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="loading" id="loading">Loading game...<br><small>This may take a moment</small></div>
        <div class="error" id="error">
            <h3>Game Failed to Load</h3>
            <p id="error-message">Unknown error occurred</p>
            <button id="retry-btn" style="margin-top: 10px; padding: 8px 16px; background: #4285f4; color: white; border: none; border-radius: 4px; cursor: pointer;">Retry</button>
        </div>
        <div class="debug" id="debug"></div>
        <div class="controls-hint" id="controls-hint">Tap the game to enable controls</div>
        <div id="game"></div>
    </div>

    <script>
        // Configure emulator BEFORE loading
        EJS_player = '#game';
        EJS_core = 'n64';
        EJS_gameName = 'Ocarina of Time';
        EJS_gameUrl = 'The%20Legend%20of%20Zelda%20Ocarina%20of%20Time.z64';
        EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/';
        EJS_startOnLoaded = true;
        
        // Debug logger
        function log(message) {
            console.log(message);
            document.getElementById('debug').innerHTML = message;
        }
        
        // Error handler
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error-message').textContent = message;
        }
        
        log('Loading emulator from CDN...');
        
        // Check if game loads after timeout
        setTimeout(function() {
            const canvas = document.querySelector('#game canvas');
            if (!canvas) {
                showError('Game failed to initialize. N64 emulation may not work well on iPad. Consider using the Delta Emulator app instead.');
            } else {
                log('Game loaded successfully!');
                document.getElementById('loading').style.display = 'none';
                
                // Hide controls hint after 5 seconds
                setTimeout(function() {
                    document.getElementById('controls-hint').style.display = 'none';
                }, 5000);
            }
        }, 20000); // 20 second timeout for iPad
        
        // Retry button
        document.getElementById('retry-btn').addEventListener('click', function() {
            location.reload();
        });
        
        // Add touch event listener to enable audio on iOS
        document.addEventListener('touchstart', function() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            document.getElementById('controls-hint').style.display = 'none';
        }, { once: true });
    </script>
    
    <!-- Load EmulatorJS from CDN -->
    <script src="https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/loader.js"></script>
</body>
</html>
