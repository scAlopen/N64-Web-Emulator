<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>The Legend of Zelda: Ocarina of Time</title>
    <script src="data/loader.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game { 
            width: 100%; 
            height: 100vh; 
            max-width: 100%;
            max-height: 100%;
        }
        .loading {
            color: white;
            position: absolute;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">Loading game...</div>
    <div id="game"></div>
    <script>
        EJS_player = '#game';
        EJS_gameName = 'Ocarina of Time';
        // Updated with the exact filename including spaces
        EJS_gameUrl = 'The Legend of Zelda Ocarina of Time.z64';
        EJS_pathtodata = 'data/'; // Use your local data folder
        EJS_startOnLoaded = true;
        EJS_gameID = 1;
        
        // Hide loading message when game starts
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loading').style.display = 'none';
            }, 3000);
        });
    </script>
</body>
</html>
