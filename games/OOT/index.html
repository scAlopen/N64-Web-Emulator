<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zelda OOT</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #game {
            width: 100%;
            max-width: 100vw;
            height: 100vh;
        }
        #status {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
            max-width: 90%;
        }
    </style>
</head>
<body>
    <div id="status">Loading...</div>
    <div id="game"></div>
    
    <script>
        document.getElementById('status').textContent = 'Step 1: Configuring...';
        
        // Set up configuration with Catbox link
        window.EJS_player = '#game';
        window.EJS_core = 'n64';
        window.EJS_gameUrl = 'https://files.catbox.moe/6l3no3.z64';
        window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/';
        
        document.getElementById('status').textContent = 'Step 2: Loading EmulatorJS...';
    </script>
    
    <script src="https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/loader.js" 
            onload="document.getElementById('status').textContent = 'Step 3: EmulatorJS loaded! Downloading ROM...';"
            onerror="document.getElementById('status').textContent = 'ERROR: Could not load EmulatorJS.';">
    </script>
    
    <script>
        // Check after 60 seconds (ROM download + loading time)
        setTimeout(function() {
            const canvas = document.querySelector('#game canvas');
            if (canvas) {
                document.getElementById('status').textContent = 'Game running! (Performance may be slow on iPad)';
                setTimeout(function() {
                    document.getElementById('status').style.display = 'none';
                }, 5000);
            } else {
                document.getElementById('status').textContent = 'Still loading... N64 emulation on iPad is very slow. Please wait up to 2 minutes...';
                
                // Check again after another minute
                setTimeout(function() {
                    const canvas2 = document.querySelector('#game canvas');
                    if (!canvas2) {
                        document.getElementById('status').innerHTML = 'FAILED: N64 emulation may not work on iPad Safari.<br>Try using Chrome or consider Delta Emulator app.';
                    }
                }, 60000);
            }
        }, 60000);
    </script>
</body>
</html>
