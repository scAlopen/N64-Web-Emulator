<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>The Legend of Zelda: Ocarina of Time</title>
    <script src="data/loader.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #game { 
            width: 100%; 
            height: 100vh; 
            max-width: 100%;
            max-height: 100%;
            position: relative;
        }
        .loading {
            color: white;
            position: absolute;
            font-size: 24px;
            z-index: 10;
            text-align: center;
        }
        .error {
            color: #ff6b6b;
            position: absolute;
            font-size: 18px;
            z-index: 10;
            text-align: center;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            max-width: 80%;
            display: none;
        }
        .controls-hint {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            color: white;
            text-align: center;
            font-size: 14px;
            opacity: 0.7;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">Loading game...<br><small>This may take a moment on iPad</small></div>
    <div class="error" id="error">
        <h3>Game Failed to Load</h3>
        <p>This could be due to iPad restrictions or file path issues.</p>
    </div>
    <div class="controls-hint" id="controls-hint">Tap the game to enable controls</div>
    <div id="game"></div>
    <script>
        // Use URL encoding for the filename with spaces
        EJS_player = '#game';
        EJS_gameName = 'Ocarina of Time';
        EJS_gameUrl = 'The%20Legend%20of%20Zelda%20Ocarina%20of%20Time.z64'; // URL encoded
        EJS_pathtodata = 'data/';
        EJS_startOnLoaded = true;
        EJS_gameID = 1;
        
        // iPad-specific fixes
        document.addEventListener('DOMContentLoaded', function() {
            const gameElement = document.getElementById('game');
            
            // Add touch event listener to enable audio on iOS
            gameElement.addEventListener('touchstart', function() {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                document.getElementById('controls-hint').style.display = 'none';
            }, { once: true });
            
            // Check if game loads after timeout
            setTimeout(function() {
                const canvas = document.querySelector('#game canvas');
                if (!canvas) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('error').style.display = 'block';
                } else {
                    document.getElementById('loading').style.display = 'none';
                    // Hide controls hint after 5 seconds
                    setTimeout(function() {
                        document.getElementById('controls-hint').style.display = 'none';
                    }, 5000);
                }
            }, 10000); // Longer timeout for iPad
        });
        
        // Handle errors
        window.addEventListener('error', function(e) {
            console.error('Emulator error:', e);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
        });
    </script>
</body>
</html> s
